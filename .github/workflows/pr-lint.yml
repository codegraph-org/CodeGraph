name: "PR Quality Lint"

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: Validate Title & Issue Link
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commits title format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false

      - name: Check for Linked Issue in PR Body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if echo "$PR_BODY" | grep -Ei "(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved) #[0-9]+" > /dev/null; then
            echo "Linked issue found in PR body."
          else
            echo "::warning title=Missing Linked Issue::PR body does not appear to contain a linked issue (e.g. 'Closes #123')."
          fi
